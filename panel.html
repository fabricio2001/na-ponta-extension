<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Na Ponta</title><link rel="stylesheet" href="style.css"></head>
<body class="panel"><header><div><span class="eyebrow">SUA COLA DE REUNIÃO</span><h1>Na Ponta<span class="dot">.</span></h1></div><button id="settings" class="icon" title="Abrir configurações" aria-label="Abrir configurações">⚙</button></header>
<main><label class="sr-only" for="search">Buscar perguntas ou respostas</label><input id="search" type="search" placeholder="Buscar uma pergunta ou resposta…" autocomplete="off"><div class="list-heading"><span>SEUS TÓPICOS</span><span id="count" aria-live="polite"></span></div><p id="error" role="alert" hidden></p><div id="list"></div><button id="more" class="secondary full" hidden>Mostrar mais perguntas</button><section id="empty" class="empty" hidden><span class="empty-symbol">✎</span><h2>Uma resposta, na hora certa.</h2><p>Cadastre suas perguntas e deixe as respostas prontas para a próxima reunião.</p><button id="start" class="primary">Cadastrar perguntas</button></section><p id="no-results" class="empty" hidden>Nenhuma pergunta encontrada.<br>Tente outra palavra.</p></main><footer>Seu ritmo. Suas palavras.</footer><script type="module" src="panel.js"></script></body></html>
